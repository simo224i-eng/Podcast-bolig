name: Generate podcast

on:
  schedule:
    # Hver søndag kl. 20:00 UTC
    - cron: "0 20 * * 0"
  workflow_dispatch:
    inputs:
      voice:
        description: "edge-tts voice override (e.g. da-DK-ChristelNeural)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "articles.txt"
      - "src/**"
      - ".github/workflows/generate.yml"

permissions:
  contents: write

concurrency:
  group: generate-podcast
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate episodes and feed
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TTS_VOICE: ${{ github.event.inputs.voice }}
        run: |
          python -m src.main --verbose

      - name: Commit and push generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate podcast episodes and feed"
          file_pattern: "docs/* state/processed.json"
